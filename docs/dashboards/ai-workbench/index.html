<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSMCloud · 数据智能工作台</title>
    <link rel="stylesheet" href="css/workbench.css" />
  </head>
  <body>
    <div class="layout" id="app">
      <aside class="sider">
        <div class="sider-logo">
          <span class="logo-mark">DC</span>
          <span class="logo-text">DSMCloud</span>
        </div>
        <nav class="sider-menu" id="sider-menu"></nav>
      </aside>

      <div class="layout-main">
        <header class="header" id="header"></header>
        <div class="workspace" id="workspace">
          <aside class="session-panel" id="session-panel" hidden></aside>
          <div class="content-wrap">
            <div class="content-card" id="main"></div>
          </div>
          <aside class="right-panel" id="right-panel" hidden></aside>
        </div>
      </div>
    </div>

    <div id="modal-root"></div>
    <div class="toast" id="toast"></div>

    <script src="js/mock-data.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
